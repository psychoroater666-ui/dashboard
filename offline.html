<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#010197">
<title>Crumble Sentinel — offline</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#F8FAFC; color:#0F172A; }
  .box { width:100%; max-width:360px; text-align:center; }
  img { width:88px; height:88px; border-radius:22px; box-shadow:0 10px 30px rgba(1,1,151,.28); }
  h1 { margin:22px 0 8px; font-size:1.25rem; font-weight:800; letter-spacing:-.2px; }
  p { margin:0 0 22px; font-size:0.92rem; line-height:1.55; color:#64748B; }
  button { width:100%; height:48px; border:none; border-radius:12px; background:linear-gradient(135deg,#010197,#3B5BDB); color:#fff;
           font-weight:700; font-size:0.95rem; font-family:inherit; cursor:pointer; box-shadow:0 6px 18px rgba(1,1,151,.28); }
  @media (prefers-color-scheme: dark){ body{ background:#0D1117; color:#E6EDF3; } p{ color:#8B949E; } }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="Crumble Sentinel">
    <h1>You're offline</h1>
    <p>Crumble Sentinel needs a connection to show live data. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
